
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b16">
<title>DARK | Access Granted</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background:
    radial-gradient(circle at 15% 15%,#24205b,transparent 40%),
    radial-gradient(circle at 85% 85%,#183b53,transparent 40%),
    #080b16;
  color: white;
  font-family: Arial, sans-serif;
}

.card {
  width: 100%;
  max-width: 380px;
  padding: 35px 25px;
  text-align: center;
  border: 1px solid #ffffff20;
  border-radius: 25px;
  background: #ffffff0b;
  backdrop-filter: blur(20px);
  box-shadow: 0 20px 70px #0008;
}

.logo {
  font-size: 34px;
  font-weight: 900;
  letter-spacing: 6px;
}

.loader {
  width: 48px;
  height: 48px;
  margin: 30px auto 22px;
  border: 4px solid #ffffff20;
  border-top-color: #8065ff;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

h2 {
  font-size: 22px;
  margin-bottom: 12px;
}

p {
  color: #aab5d0;
  font-size: 13px;
  line-height: 1.7;
}

.status {
  margin-top: 25px;
  padding: 13px;
  border-radius: 12px;
  background: #ffffff0c;
  color: #b9c5e0;
  font-size: 12px;
}

.footer {
  margin-top: 25px;
  color: #66718c;
  font-size: 10px;
}
</style>
</head>

<body>

<div class="card">
  <div class="logo">DARK.</div>

  <div class="loader"></div>

  <h2>Access Granted!</h2>

  <p>
    Your access is being activated.
    You will be redirected automatically.
  </p>

  <div class="status">
    Preparing your learning space...
  </div>

  <div class="footer">
    DARK STUDY HUB · 2026
  </div>
</div>

<script>
const ACCESS_KEY = "dark_access_until";
const ONE_MONTH = 30 * 24 * 60 * 60 * 1000;

// Save access for 30 days
const expiry = Date.now() + ONE_MONTH;

localStorage.setItem(ACCESS_KEY, expiry.toString());

// Redirect to homepage
setTimeout(() => {
  window.location.replace("https://darkstudyhub.github.io/");
}, 1000);
</script>

</body>
</html>
