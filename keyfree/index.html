
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b16">
<title>DARK | Access Granted</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:
 radial-gradient(circle at 15% 15%,#24205b,transparent 40%),
 radial-gradient(circle at 85% 85%,#183b53,transparent 40%),
 #080b16;
 color:white;
 font-family:Arial,sans-serif;
}

.card{
 width:100%;
 max-width:380px;
 padding:38px 25px;
 text-align:center;
 border:1px solid #ffffff20;
 border-radius:25px;
 background:#ffffff0b;
 backdrop-filter:blur(20px);
 box-shadow:0 20px 70px #0008;
}

.logo{
 font-size:36px;
 font-weight:900;
 letter-spacing:6px;
}

.loader{
 width:48px;
 height:48px;
 margin:30px auto 22px;
 border:4px solid #ffffff20;
 border-top-color:#8065ff;
 border-radius:50%;
 animation:spin .8s linear infinite;
}

@keyframes spin{
 to{transform:rotate(360deg)}
}

h2{font-size:23px;margin-bottom:12px}

p{
 color:#aab5d0;
 font-size:13px;
 line-height:1.7;
}

.status{
 margin-top:25px;
 padding:14px;
 border-radius:12px;
 background:#ffffff0c;
 color:#b9c5e0;
 font-size:12px;
}

.footer{
 margin-top:25px;
 color:#66718c;
 font-size:10px;
}
</style>
</head>

<body>

<div class="card">
 <div class="logo">DARK.</div>

 <div class="loader"></div>

 <h2>Access Activated!</h2>

 <p>
 Your learning access is being prepared.
 You will be redirected shortly.
 </p>

 <div class="status">
 Redirecting to DARK Study Hub...
 </div>

 <div class="footer">
 © 2026 DARK STUDY HUB
 </div>
</div>

<script>
(function(){

 const ACCESS_KEY = "dark_access_until";
 const DURATION = 30 * 24 * 60 * 60 * 1000;

 // Activate access for 30 days
 localStorage.setItem(
   ACCESS_KEY,
   String(Date.now() + DURATION)
 );

 // Redirect to main website
 setTimeout(function(){
   window.location.replace(
     "https://darkstudyhub.github.io/"
   );
 }, 1000);

})();
</script>

</body>
</html>
